services:
  server:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://skael:skael@db:5432/skael?sslmode=disable
      STORAGE_PATH: /data/skills
    volumes:
      - skill-data:/data/skills
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: skael
      POSTGRES_PASSWORD: skael
      POSTGRES_DB: skael
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skael"]
      interval: 5s
      timeout: 5s
      retries: 5

  # The eval worker, behind a profile because it needs an LLM key and a Docker
  # socket the other services have no business holding:
  #
  #   docker compose --profile worker up
  #
  # It starts sandbox containers as SIBLINGS through the host's socket, so the
  # daemon resolves every bind source on the HOST. WORKER_RUN_ROOT (session
  # workspaces) and WORKER_WORK_ROOT (the eval workspace, whose verifier/ is
  # mounted at /verifier) must therefore be bound at the SAME path on both
  # sides — never a named volume, whose container path is not a host path.
  # Docker creates a missing bind source as an empty directory rather than
  # failing, so a wrong root yields a sandbox with no task or no verifier. The
  # worker refuses to start containerized unless both are set.
  #
  # Pick ONE auth setup below. The judge always authenticates with a key or a
  # token whatever gateway it points at, because a published score must come
  # from a metered backend — what changes is the endpoint and how the panel
  # agent is billed.
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    profiles: ["worker"]
    environment:
      SKAEL_ENDPOINT: http://server:8080
      # Plain interpolation, not `${VAR:?...}`: compose interpolates inactive
      # profiles too, so a required marker here breaks `docker compose up` for
      # everyone who never asked for a worker. skael-worker already names what
      # is missing at startup.
      SKAEL_API_KEY: ${SKAEL_API_KEY:-}
      # Must match the volumes below on BOTH sides of the colon.
      WORKER_RUN_ROOT: ${SKAEL_RUN_ROOT:-/var/lib/skael/run}
      WORKER_WORK_ROOT: ${SKAEL_WORK_ROOT:-/var/lib/skael/work}
      WORKER_CONCURRENCY: 6

      # ----------------------------------------------------------------------
      # A. Anthropic API key (active). Judge and panel both bill per call
      #    against Anthropic directly. Nothing else is needed.
      #
      #      export ANTHROPIC_API_KEY=sk-ant-...
      # ----------------------------------------------------------------------
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

      # ----------------------------------------------------------------------
      # B. Claude subscription (Pro/Max) for the panel, API key for the judge.
      #    A token, not a ~/.claude mount, so it works in a container:
      #
      #      export CLAUDE_CODE_OAUTH_TOKEN=$(claude setup-token)
      #
      #    ANTHROPIC_API_KEY above stays set — the judge has no subscription
      #    path. Both reach the sandbox and Claude Code picks by its own auth
      #    precedence, so confirm billing against your usage rather than
      #    assuming.
      # ----------------------------------------------------------------------
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}

      # ----------------------------------------------------------------------
      # D. OpenRouter for the judge, subscription for the panel. Setup C's
      #    three variables plus setup B's token, all four set at once.
      #
      #    The token beside a base URL selects the split: the judge dials the
      #    gateway, and the worker withholds the gateway's variables from the
      #    sandbox so the panel cannot follow it there. LLM_MODEL then names
      #    the judge alone — the panel asks for the shipped alias, which is
      #    what a subscription serves.
      #
      #    The panel is recorded in model_panel, so switching a shared
      #    instance into or out of this splits every skill's score trend at
      #    the changeover. It is a local and small-team setup.
      # ----------------------------------------------------------------------

      # ----------------------------------------------------------------------
      # C. OpenRouter for both judge and panel. Uncomment the three below and
      #    leave ANTHROPIC_API_KEY unset — the bearer token replaces it.
      #
      #      export OPENROUTER_API_KEY=sk-or-...
      #
      #    One gateway serves the judge and the panel. It posts to
      #    {base}/v1/messages, so the base URL carries no /v1. The auth header
      #    is inferred: a token is sent as a bearer token, a key as x-api-key.
      #
      #    LLM_MODEL is required here. The shipped panel asks for Anthropic's
      #    bare alias "sonnet", which a namespacing gateway 404s, and the judge
      #    would ask for "claude-opus-5". Most capable first: the first entry
      #    judges and leads the panel, later entries are the panel's floor
      #    members at the deep tier.
      #
      #    Watch reasoning models for the judge: one that spends its whole
      #    output budget on thinking tokens returns no text block, and the run
      #    fails rather than scoring something empty.
      # ----------------------------------------------------------------------
      ANTHROPIC_BASE_URL: https://openrouter.ai/api
      ANTHROPIC_AUTH_TOKEN: ${OPENROUTER_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
    volumes:
      # Sibling containers, not Docker-in-Docker: this is the host's daemon.
      - /var/run/docker.sock:/var/run/docker.sock
      # Identical host and container paths — see (1) above. Changing only one
      # side of either, or swapping one for a named volume, reintroduces
      # exactly the silent-empty-mount failure.
      - ${SKAEL_RUN_ROOT:-/var/lib/skael/run}:${SKAEL_RUN_ROOT:-/var/lib/skael/run}
      - ${SKAEL_WORK_ROOT:-/var/lib/skael/work}:${SKAEL_WORK_ROOT:-/var/lib/skael/work}
    depends_on:
      server:
        condition: service_started

volumes:
  skill-data:
  pg-data:
