services:
  server:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://skael:skael@db:5432/skael?sslmode=disable
      STORAGE_PATH: /data/skills
    volumes:
      - skill-data:/data/skills
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: skael
      POSTGRES_PASSWORD: skael
      POSTGRES_DB: skael
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skael"]
      interval: 5s
      timeout: 5s
      retries: 5

  # The eval worker, behind a profile because it needs an LLM key and a Docker
  # socket the other services have no business holding:
  #
  #   docker compose --profile worker up
  #
  # It starts sandbox containers as SIBLINGS through the host's socket, so the
  # daemon resolves every bind source on the HOST. WORKER_RUN_ROOT (session
  # workspaces) and WORKER_WORK_ROOT (the eval workspace, whose verifier/ is
  # mounted at /verifier) must therefore be bound at the SAME path on both
  # sides — never a named volume, whose container path is not a host path.
  # Docker creates a missing bind source as an empty directory rather than
  # failing, so a wrong root yields a sandbox with no task or no verifier. The
  # worker refuses to start containerized unless both are set.
  #
  # Pick ONE auth setup below. The judge always authenticates with a key or a
  # token whatever gateway it points at, because a published score must come
  # from a metered backend — what changes is the endpoint and how the panel
  # agent is billed.
  worker:
    # ------------------------------------------------------------------------
    # This compose file runs the docker driver (SANDBOX_DRIVER=docker, the
    # default) — the socket mount and the WORKER_RUN_ROOT / WORKER_WORK_ROOT
    # binds below exist only for it.
    #
    # SANDBOX_DRIVER=kubernetes needs neither: it schedules a session pod
    # through the cluster API instead of a Docker socket, so drop the socket
    # mount and the two binds and set SANDBOX_K8S_NAMESPACE. See
    # deploy/kubernetes/README.md.
    #
    # SANDBOX_DRIVER=northflank needs neither either: it runs each session as
    # a service in a Northflank project, so it wants only an API token. See
    # deploy/northflank/README.md.
    #
    #   SANDBOX_DRIVER: northflank
    #   SANDBOX_NF_TOKEN: ${SANDBOX_NF_TOKEN:-}
    #   SANDBOX_NF_PROJECT: ${SANDBOX_NF_PROJECT:-}
    # ------------------------------------------------------------------------
    # Built from source here. For a deployment, use the published image
    # instead: ghcr.io/skael-dev/skael-worker:latest
    build:
      context: .
      dockerfile: Dockerfile.worker
      args:
        # Stamps the binary so the server accepts its reports. Empty falls
        # back to the Dockerfile's own default, which is enough to run; set it
        # to your deployed tag on an instance whose score history matters.
        VERSION: ${SKAEL_VERSION:-}
    profiles: ["worker"]
    environment:
      SKAEL_ENDPOINT: http://server:8080
      # Plain interpolation, not `${VAR:?...}`: compose interpolates inactive
      # profiles too, so a required marker here breaks `docker compose up` for
      # everyone who never asked for a worker. skael-worker already names what
      # is missing at startup.
      SKAEL_API_KEY: ${SKAEL_API_KEY:-}
      # Must match the volumes below on BOTH sides of the colon.
      WORKER_RUN_ROOT: ${SKAEL_RUN_ROOT:-/var/lib/skael/run}
      WORKER_WORK_ROOT: ${SKAEL_WORK_ROOT:-/var/lib/skael/work}
      WORKER_CONCURRENCY: 6
      # Provider keys stay on the server: add a provider and its key on the
      # Evaluation page, and each job claim carries the keys it needs.
    volumes:
      # Sibling containers, not Docker-in-Docker: this is the host's daemon.
      - /var/run/docker.sock:/var/run/docker.sock
      # Identical host and container paths — see (1) above. Changing only one
      # side of either, or swapping one for a named volume, reintroduces
      # exactly the silent-empty-mount failure.
      - ${SKAEL_RUN_ROOT:-/var/lib/skael/run}:${SKAEL_RUN_ROOT:-/var/lib/skael/run}
      - ${SKAEL_WORK_ROOT:-/var/lib/skael/work}:${SKAEL_WORK_ROOT:-/var/lib/skael/work}
    depends_on:
      server:
        condition: service_started

volumes:
  skill-data:
  pg-data:
