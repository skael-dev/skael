services:
  server:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://skael:skael@db:5432/skael?sslmode=disable
      STORAGE_PATH: /data/skills
    volumes:
      - skill-data:/data/skills
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: skael
      POSTGRES_PASSWORD: skael
      POSTGRES_DB: skael
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skael"]
      interval: 5s
      timeout: 5s
      retries: 5

# The eval worker is deliberately NOT a service here. It bind-mounts paths it
# computes locally — the eval workspace and the agent credential directories —
# into sandbox containers through the Docker socket. Those mounts are resolved
# by the HOST daemon, so a worker running inside a container would hand the
# daemon paths that only exist in its own filesystem, and every sandbox would
# come up with empty mounts. Run skael-worker on the host instead:
# https://skael.dev/docs/quality
volumes:
  skill-data:
  pg-data:
