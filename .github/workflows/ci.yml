name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1 -timeout 300s

  sandbox:
    runs-on: ubuntu-latest
    # The sandbox half of the eval engine is not allowed to be an ungated
    # appendix: a green suite that silently excludes every Docker-dependent
    # behaviour means less than it appears to. The runner already has a daemon;
    # the slim base image is what keeps this job to a few minutes.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet docker-tagged code
        run: go vet -tags docker ./...
      - name: Sandbox tests
        env:
          WHETSTONE_BASE_TAG: whetstone-base-ci:1
        run: go test -tags docker ./internal/eval/... ./cli/whetstone/ ./tests/whetstone/... -count=1 -timeout 2400s

  kubernetes-sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # kind is not preinstalled on the runner image, unlike kubectl and
      # docker. install_only skips the action's own cluster creation, because
      # this job needs the no-CNI config below rather than the action's
      # default one.
      - name: Install kind
        uses: helm/kind-action@v1
        with:
          install_only: true

      # The default CNI ignores NetworkPolicy, which would let the egress test
      # pass while enforcing nothing.
      - name: Create a kind cluster with no CNI
        run: |
          cat > kind.yaml <<'EOF'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          networking:
            disableDefaultCNI: true
            podSubnet: "192.168.0.0/16"
          EOF
          kind create cluster --config kind.yaml --wait 5m

      - name: Install Calico
        run: |
          kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.28.0/manifests/calico.yaml
          kubectl -n kube-system rollout status daemonset/calico-node --timeout=5m
          kubectl wait --for=condition=Ready nodes --all --timeout=5m

      - name: Build and load the slim base image
        run: |
          go run ./cmd/whetstone --print-base-dockerfile --slim > Dockerfile.base
          docker build -t whetstone-base-ci:1 -f Dockerfile.base .
          kind load docker-image whetstone-base-ci:1

      - name: Apply the shipped RBAC manifest
        run: kubectl apply -f deploy/kubernetes/worker-rbac.yaml

      - name: Run the Kubernetes sandbox conformance suite
        env:
          SANDBOX_DRIVER: kubernetes
          SANDBOX_K8S_NAMESPACE: skael-sandbox
          SANDBOX_K8S_IMAGE: whetstone-base-ci:1
          SANDBOX_K8S_NETWORK_POLICY: "true"
        # Every other job in this workflow calls go test directly; just is
        # not installed on the runner and no step here installs it either.
        run: go test -count=1 -tags=kubernetes ./internal/eval/sandbox/kubernetes/ -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # v6 pulls a golangci-lint built with Go 1.24, which refuses to run
      # against a module targeting a newer Go. v9 tracks golangci-lint v2.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  web-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The generated SDK under web/src/api/ is not tracked, so it has to be
      # produced from the server's OpenAPI spec before anything imports it.
      # Same sequence the build and typecheck jobs run.
      - name: Install dependencies and generate SDK
        run: |
          npm ci
          go build -o ../bin/skael-server ../cmd/server/
          ../bin/skael-server --openapi > openapi.json
          npx @hey-api/openapi-ts

      - run: npx vitest run

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build SPA
        run: |
          cd web && npm ci
          go build -o ../bin/skael-server ../cmd/server/
          ../bin/skael-server --openapi > openapi.json
          npx @hey-api/openapi-ts
          npm run build

      - name: Build binaries
        run: |
          CGO_ENABLED=0 go build -o bin/skael ./cmd/skael/
          CGO_ENABLED=0 go build -o bin/skael-server ./cmd/server/
          CGO_ENABLED=0 go build -o bin/whetstone ./cmd/whetstone/
          CGO_ENABLED=0 go build -o bin/skael-worker ./cmd/skael-worker/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Type check
        run: |
          cd web && npm ci
          go build -o ../bin/skael-server ../cmd/server/
          ../bin/skael-server --openapi > openapi.json
          npx @hey-api/openapi-ts
          npx tsc --noEmit

  # Nothing else compiles either Dockerfile until a tag is pushed, so a broken
  # one used to surface during a release. amd64 only and no push: a pull
  # request needs to know the build works, not to produce an artefact. Keep the
  # matrix identical to the release workflow's.
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: skael
            dockerfile: Dockerfile
          - image: skael-worker
            dockerfile: Dockerfile.worker
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          platforms: linux/amd64
          build-args: |
            VERSION=0.0.0-ci
          cache-from: type=gha,scope=ci-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.image }}
