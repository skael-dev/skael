name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1 -timeout 300s

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # v6 pulls a golangci-lint built with Go 1.24, which refuses to run
      # against a module targeting a newer Go. v9 tracks golangci-lint v2.
      #
      # Non-blocking as of 2026-07-29: the job had never actually executed, so
      # enabling it surfaced 50 pre-existing findings (errcheck 38, staticcheck
      # 7, unused 5). They are reported in the logs and being burned down;
      # remove continue-on-error once the count reaches zero.
      - uses: golangci/golangci-lint-action@v9
        continue-on-error: true
        with:
          version: latest

  web-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The generated SDK under web/src/api/ is not tracked, so it has to be
      # produced from the server's OpenAPI spec before anything imports it.
      # Same sequence the build and typecheck jobs run.
      - name: Install dependencies and generate SDK
        run: |
          npm ci
          go build -o ../bin/skael-server ../cmd/server/
          ../bin/skael-server --openapi > openapi.json
          npx @hey-api/openapi-ts

      - run: npx vitest run

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build SPA
        run: |
          cd web && npm ci
          go build -o ../bin/skael-server ../cmd/server/
          ../bin/skael-server --openapi > openapi.json
          npx @hey-api/openapi-ts
          npm run build

      - name: Build binaries
        run: |
          CGO_ENABLED=0 go build -o bin/skael ./cmd/skael/
          CGO_ENABLED=0 go build -o bin/skael-server ./cmd/server/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Type check
        run: |
          cd web && npm ci
          go build -o ../bin/skael-server ../cmd/server/
          ../bin/skael-server --openapi > openapi.json
          npx @hey-api/openapi-ts
          npx tsc --noEmit
