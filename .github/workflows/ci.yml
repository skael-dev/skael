name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1 -timeout 300s

  sandbox:
    runs-on: ubuntu-latest
    # The sandbox half of the eval engine is not allowed to be an ungated
    # appendix: a green suite that silently excludes every Docker-dependent
    # behaviour means less than it appears to. The runner already has a daemon;
    # the slim base image is what keeps this job to a few minutes.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet docker-tagged code
        run: go vet -tags docker ./...
      - name: Sandbox tests
        env:
          WHETSTONE_BASE_TAG: whetstone-base-ci:1
        # -p 1: internal/eval/sandbox/docker's own sweep tests zero Sweep's
        # age guard and sweep by a daemon-wide label with no per-process
        # scoping, so run concurrently with any other docker-tagged package
        # they reap that package's live containers outright. See justfile's
        # test-docker for the full account.
        run: go test -tags docker -p 1 ./internal/eval/... ./cli/whetstone/ ./tests/whetstone/... -count=1 -timeout 2400s

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # v6 pulls a golangci-lint built with Go 1.24, which refuses to run
      # against a module targeting a newer Go. v9 tracks golangci-lint v2.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  web-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The generated SDK under web/src/api/ is not tracked, so it has to be
      # produced from the server's OpenAPI spec before anything imports it.
      # Same sequence the build and typecheck jobs run.
      - name: Install dependencies and generate SDK
        run: |
          npm ci
          go build -o ../bin/skael-server ../cmd/server/
          ../bin/skael-server --openapi > openapi.json
          npx @hey-api/openapi-ts

      - run: npx vitest run

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build SPA
        run: |
          cd web && npm ci
          go build -o ../bin/skael-server ../cmd/server/
          ../bin/skael-server --openapi > openapi.json
          npx @hey-api/openapi-ts
          npm run build

      - name: Build binaries
        run: |
          CGO_ENABLED=0 go build -o bin/skael ./cmd/skael/
          CGO_ENABLED=0 go build -o bin/skael-server ./cmd/server/
          CGO_ENABLED=0 go build -o bin/whetstone ./cmd/whetstone/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Type check
        run: |
          cd web && npm ci
          go build -o ../bin/skael-server ../cmd/server/
          ../bin/skael-server --openapi > openapi.json
          npx @hey-api/openapi-ts
          npx tsc --noEmit
