name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install web dependencies
        run: cd web && npm ci

      - name: Generate OpenAPI spec
        run: |
          go build -o bin/skael-server ./cmd/server/
          bin/skael-server --openapi > web/openapi.json

      - name: Generate SDK
        run: cd web && npx @hey-api/openapi-ts

      - name: Build SPA
        run: cd web && npm run build

      - name: Restore .gitkeep deleted by SPA build
        run: touch web/dist/.gitkeep

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.RELEASE_TOKEN }}

  # Every published image is one entry in this matrix. A new binary that ships
  # as a container is added here, not as a copied step — the worker image went
  # unpublished for several releases because there was only ever one step and
  # it hard-coded the server's Dockerfile.
  images:
    needs: release
    runs-on: ubuntu-latest
    # Inherited from the workflow, restated so a later edit to the top-level
    # block cannot silently remove the push credential.
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: skael
            dockerfile: Dockerfile
          - image: skael-worker
            dockerfile: Dockerfile.worker
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Extract version tag
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      # VERSION is not cosmetic for the worker: the server rejects a report
      # whose engine_version is "" or "dev", and a constant defeats
      # report.Comparable, so every build would chart as one trend.
      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.version.outputs.tag }}
          tags: |
            ghcr.io/skael-dev/${{ matrix.image }}:${{ steps.version.outputs.tag }}
            ghcr.io/skael-dev/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
