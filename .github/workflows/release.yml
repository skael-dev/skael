name: Release

on:
  push:
    tags:
      - "v*"
  # Publish an image without cutting a release: a tag whose image build failed,
  # or a new image added after the tag it belongs to. It builds from the named
  # tag, never from a branch, so a republished image is the same source as the
  # release it claims to be.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build the images from, for example v0.12.0"
        required: true
      images:
        description: "Which image to publish"
        required: true
        default: all
        type: choice
        options:
          - all
          - skael
          - skael-worker

permissions:
  contents: write
  packages: write

jobs:
  release:
    # A manual run publishes images only. GoReleaser has already run for the
    # tag, and `release --clean` on an existing one fails.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install web dependencies
        run: cd web && npm ci

      - name: Generate OpenAPI spec
        run: |
          go build -o bin/skael-server ./cmd/server/
          bin/skael-server --openapi > web/openapi.json

      - name: Generate SDK
        run: cd web && npx @hey-api/openapi-ts

      - name: Build SPA
        run: cd web && npm run build

      - name: Restore .gitkeep deleted by SPA build
        run: touch web/dist/.gitkeep

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.RELEASE_TOKEN }}

  # Every published image is one entry in this matrix. A new binary that ships
  # as a container is added here, not as a copied step — the worker image went
  # unpublished for several releases because there was only ever one step and
  # it hard-coded the server's Dockerfile.
  images:
    needs: release
    # `always()` because the release job is skipped on a manual run, and a
    # skipped dependency would otherwise skip this job too.
    if: always() && needs.release.result != 'failure' && needs.release.result != 'cancelled'
    runs-on: ubuntu-latest
    # Inherited from the workflow, restated so a later edit to the top-level
    # block cannot silently remove the push credential.
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: skael
            dockerfile: Dockerfile
          - image: skael-worker
            dockerfile: Dockerfile.worker
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # A manual run does not move `latest`. It exists to republish a named
      # tag, and that tag is not always the newest one.
      - name: Resolve tags
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          IMAGE: ghcr.io/skael-dev/${{ matrix.image }}
        run: |
          ref="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          version="${ref#v}"
          echo "tag=${version}" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "${IMAGE}:${version}"
            if [ -z "$INPUT_TAG" ]; then echo "${IMAGE}:latest"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # VERSION is not cosmetic for the worker: the server rejects a report
      # whose engine_version is "" or "dev", and a constant defeats
      # report.Comparable, so every build would chart as one trend.
      - name: Build and push ${{ matrix.image }}
        if: inputs.images == '' || inputs.images == 'all' || inputs.images == matrix.image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.version.outputs.tag }}
          tags: ${{ steps.version.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
