{{- if not .Values.server.database.existingSecret }}
{{- if not .Values.server.database.url }}
{{- fail "set server.database.url or server.database.existingSecret" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "skael.databaseSecret" . }}
  labels: {{- include "skael.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.server.database.url | quote }}
---
{{- end }}
{{- if not .Values.server.masterKeys.existingSecret }}
{{- $name := include "skael.keysSecret" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "skael.labels" . | nindent 4 }}
  annotations:
    # A new key would make every saved secret unreadable, so the key outlives
    # an uninstall.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $existing $existing.data }}
  SKAEL_MASTER_KEYS: {{ index $existing.data "SKAEL_MASTER_KEYS" }}
  {{- else }}
  SKAEL_MASTER_KEYS: {{ printf "k1:%s" (randAlphaNum 32 | b64enc) | b64enc }}
  {{- end }}
{{- end }}
