version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: skael
    main: ./cmd/skael
    binary: skael
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}} -X main.date={{.Date}}

  - id: skael-server
    main: ./cmd/server
    binary: skael-server
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}} -X main.date={{.Date}}

  - id: whetstone
    main: ./cmd/whetstone
    binary: whetstone
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}} -X main.date={{.Date}}

  - id: skael-worker
    main: ./cmd/skael-worker
    binary: skael-worker
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}} -X main.date={{.Date}}

archives:
  - id: skael
    ids:
      - skael
    name_template: "skael_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

  - id: skael-server
    ids:
      - skael-server
    name_template: "skael-server_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

  - id: whetstone
    ids:
      - whetstone
    name_template: "whetstone_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

  - id: skael-worker
    ids:
      - skael-worker
    name_template: "skael-worker_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"

changelog:
  # Release notes are written by hand and applied with `gh release edit
  # --notes-file` after the pipeline publishes. An auto-generated commit list
  # underneath them is noise: this repo squash-merges, so the list is a handful
  # of PR titles that say far less than the notes above it already do.
  disable: true
  sort: asc
  use: github
  groups:
    - title: Features
      regexp: '^feat'
    - title: Fixes
      regexp: '^fix'
    - title: Security
      regexp: '^security'
    - title: Other
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "^refactor:"
      - "^merge:"
      - "^task"

release:
  github:
    owner: skael-dev
    name: skael
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"
  header: |
    The control plane for AI agent skills. Publish, sync, scan, and track SKILL.md files across your team's agents.

    ## Install

    ```bash
    # macOS (Homebrew)
    brew install --cask skael-dev/skael/skael

    # Linux
    curl -fsSL https://skael.dev/install.sh | sh

    # Docker
    docker pull ghcr.io/skael-dev/skael:{{.Version}}

    # Windows: download the .zip for your architecture below
    ```

    ## Self-host the platform

    Bring your own Postgres — `DATABASE_URL` is the only required env var:

    ```bash
    docker run -p 8080:8080 \
      -e DATABASE_URL="postgres://user:pass@host:5432/skael?sslmode=disable" \
      ghcr.io/skael-dev/skael:{{.Version}}
    ```

    Migrations run automatically on startup. Or use `docker compose up -d` to bundle Postgres.

    The optional evaluation worker is published beside it, as `ghcr.io/skael-dev/skael-worker:{{.Version}}`. It needs a Docker socket and an LLM key, so it runs separately from the server. Then sign up at `http://localhost:8080` to create your first account and personal API key.

    ## What's in this release
  footer: |
    **Full changelog**: https://github.com/skael-dev/skael/compare/{{ .PreviousTag }}...{{ .Tag }}

# Casks, not formulas: `brews` is formally deprecated and goes away in
# GoReleaser v3. One entry per binary, the same split the formulas had, because
# install.sh derives its download name from a single BINARY and the docs
# describe each archive as holding one binary.
#
# Casks are macOS-only — Homebrew on Linux cannot install one. Linux installs
# are install.sh or the release archive, and the docs say so rather than
# offering a `brew install` that fails.
#
# The quarantine bit has to be stripped, because these binaries are not signed
# or notarized and Gatekeeper otherwise refuses to run a cask's binary at all.
# It is written as a custom_block rather than with `hooks:`, which renders
# Homebrew's deprecated `postflight` stanza (goreleaser#6870, milestone
# v2.19.0) and makes every brew command touching this tap print a warning
# telling the user to file an issue against it. Switch back to `hooks:` once
# GoReleaser emits postflight_steps itself.
#
# {{"{{"}}staged_path{{"}}"}} is Homebrew's own template token, escaped here so
# GoReleaser's templating leaves it alone.
homebrew_casks:
  - name: skael
    ids:
      - skael
    binaries:
      - skael
    repository:
      owner: skael-dev
      name: homebrew-skael
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://skael.dev"
    description: "Control plane for AI agent skills"
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{"{{"}}staged_path{{"}}"}}/skael"]
        end
      end

  - name: whetstone
    ids:
      - whetstone
    binaries:
      - whetstone
    repository:
      owner: skael-dev
      name: homebrew-skael
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://skael.dev"
    description: "Authoring and evaluation toolkit for AI agent skills"
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{"{{"}}staged_path{{"}}"}}/whetstone"]
        end
      end
