version: 1
steps:
  - id: run-build
    desc: Run scripts/build.py to assemble the report bundle.
    match:
      type: shell
      pattern: scripts/build\.py
    order:
      mode: any
    required: true
  - id: validate-bundle
    desc: Run scripts/validate.py to validate the bundle contents against manifest.json.
    match:
      type: shell
      pattern: scripts/validate\.py
    order:
      mode: after
      after:
        - run-build
    required: true
  - id: package-bundle
    desc: Run scripts/package.py to package the bundle into out/report.zip.
    match:
      type: shell
      pattern: scripts/package\.py
    order:
      mode: after
      after:
        - validate-bundle
    required: true
  - id: validate-package
    desc: Run scripts/verify.py to validate out/report.zip against the manifest checksum.
    match:
      type: shell
      pattern: scripts/verify\.py
    order:
      mode: after
      after:
        - package-bundle
    required: true
forbid:
  - id: no-writes-outside-out
    desc: Must not write any file outside out/ at any point in this workflow.
    match:
      type: file_write
      path_not_glob: out/**
    severity: major
checkpoints:
  - validate-bundle
  - validate-package
