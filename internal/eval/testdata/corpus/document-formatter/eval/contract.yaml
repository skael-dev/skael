version: 1
steps:
  - id: read-style-guide
    desc: Read references/style-guide.md.
    match:
      type: shell
      pattern: references/style-guide\.md
    order:
      mode: any
    required: true
  - id: apply-style
    desc: Apply the style rules and fill assets/report.tmpl.
    match:
      type: shell
      pattern: assets/report\.tmpl
    order:
      mode: after
      after:
        - read-style-guide
    required: true
  - id: write-report
    desc: Write the rendered report to out/report.md.
    match:
      type: file_write
      path_glob: out/report.md
    order:
      mode: after
      after:
        - apply-style
    required: true
forbid:
  - id: no-writes-outside-out
    desc: Must not write any file outside out/.
    match:
      type: file_write
      path_not_glob: out/**
    severity: major
